<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Ícone do aplicativo: o ramo de três folhas da EcoHorta, o mesmo da caixa
    eletrônica do captador. Em vetor, para ficar nítido do favicon de 16 px ao
    ícone de 512.

    O verde abre um tom em relação ao impresso: sobre o fundo escuro, o
    verde-garrafa original desapareceria.

    O ramo cabe dentro da zona segura dos ícones "maskable" (80% centrais), por
    isso não encosta nas bordas — no Android o sistema recorta um círculo.
  -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0d4f3c"/>
      <stop offset="0.55" stop-color="#07301f"/>
      <stop offset="1" stop-color="#031a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#5be38f" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5be38f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folha" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4ad66d"/>
      <stop offset="1" stop-color="#2b8a3e"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C 28 -12, 33 -34, 14 -58 C -4 -40, -9 -18, 0 0 Z"/>
      <path d="M2 -5 C 8 -23, 12 -41, 13 -53" stroke="#ffffff" stroke-opacity="0.92" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <g transform="translate(244 366)" fill="url(#folha)">
    <path d="M6 -46 C 2 -16, 0 6, -8 40" stroke="#2b8a3e" stroke-width="13" stroke-linecap="round" fill="none"/>
    <use href="#leaf" transform="translate(4 -34) rotate(26) scale(3.2)"/>
    <use href="#leaf" transform="translate(1 -8) rotate(-32) scale(2.45)"/>
    <use href="#leaf" transform="translate(-3 10) rotate(-72) scale(1.9)"/>
  </g>
</svg>
