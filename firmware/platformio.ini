; EcoHorta Inteligente — firmware do captador (ESP32 DevKit V1 / ESP32 clássico + VL53L0X ou VL53L1X)
; Etapa 1: medição + telemetria HTTPS. SEM controle de válvula (ver docs/HARDWARE.md).
; O sensor de distância usado é o configurado na plataforma (Administração → Captadores → Ligações).

[platformio]
; O caminho do repositório tem acentos (_programação): o toolchain precisa compilar fora dele.
build_dir = C:/pio-build/ecohorta
libdeps_dir = C:/pio-build/ecohorta-libdeps
default_envs = esp32dev

[env:esp32dev]
; ESP32 DevKit V1 (módulo ESP32-WROOM-32). O Serial passa pelo conversor USB-serial da placa (CP2102 ou CH340).
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  pololu/VL53L0X@^1.3.1
  pololu/VL53L1X@^1.3.1
  bblanchon/ArduinoJson@^7.2.0
; Os testes rodam no computador (env windows_test), não na placa.
test_ignore = *

[env:windows_test]
; Testes do núcleo de sensores (lib/distance_core) no computador, sem placa:
;   pio test -d firmware -e windows_test
; Em Linux/macOS use o ambiente native_test (requer gcc).
platform = windows_x86
test_framework = unity
build_flags = -std=gnu++11
lib_deps =

[env:native_test]
; Os mesmos testes em Linux/macOS e no GitHub Actions (.github/workflows/ci.yml):
;   pio test -d firmware -e native_test
platform = native
test_framework = unity
build_flags = -std=gnu++11
lib_deps =
