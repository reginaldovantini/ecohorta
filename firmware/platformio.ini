; EcoHorta Inteligente — firmware do captador (ESP32-C3 Super Mini + VL53L1X)
; Etapa 1: medição + telemetria HTTPS. SEM controle de válvula (ver docs/HARDWARE.md).

[platformio]
; O caminho do repositório tem acentos (_programação): o toolchain precisa compilar fora dele.
build_dir = C:/pio-build/ecohorta
libdeps_dir = C:/pio-build/ecohorta-libdeps

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; USB nativo do C3 (Serial pela porta USB-C da Super Mini).
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  pololu/VL53L1X@^1.3.1
  bblanchon/ArduinoJson@^7.2.0
